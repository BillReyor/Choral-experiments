# Unit tests: the parts of Palare Piano one at a time (tests/), on every pull request - and, as a part of the
# install test (install.yml calls this), on every change to main and before a version is given out.
# The install test checks the whole program as a singer uses it; these check each part's rules - reading a score,
# the words, the voices, the mix, fixing a note, and the page's server answering only this computer.
#
# On a Mac they are run by hand, and by tools/release.sh:  sh tools/test.sh
name: unit tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'              # as the program itself runs on Windows (choral.utf8)
      PALARE_NO_BROWSER: '1'
      PALARE_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the program's packages
        run: python -m pip install -r install/app.txt -r install/tracks.txt pytest
      - name: Install what rebuilds a real voice's tone, if it can be built here (its tests are skipped without it)
        continue-on-error: true
        run: python -m pip install pyworld==0.3.5 "setuptools<81"
      - name: Run the unit tests
        run: python -m pytest -ra
