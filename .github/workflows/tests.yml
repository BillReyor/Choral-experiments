# Unit tests: the parts of Palare Piano one at a time (tests/), on every change and every pull request.
# The install test (install.yml) checks the whole program as a singer uses it; these check each part's rules -
# reading a score, the words, the voices, the mix, fixing a note, and the page's server answering only this computer.
name: unit tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.gitignore', '.github/ISSUE_TEMPLATE/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'              # as the program itself runs on Windows (choral.utf8)
      PALARE_NO_BROWSER: '1'
      PALARE_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the program's packages
        run: python -m pip install -r install/app.txt -r install/tracks.txt pytest
      - name: Run the unit tests
        run: python -m pytest -ra
